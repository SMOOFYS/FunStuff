<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Rocket Launch</title>
    <link rel="stylesheet" href="//projects.codewizardshq.com/assets/m11-base-styles.css">
    <script src="//projects.codewizardshq.com/assets/m11-error-handling.js"></script>
    <script type="module">import * as index from './__target__/index.js'; window.index = index;</script>
    <style>
        body {
            font-size: 18px;
            font-family: monospace;
        }

        #mission-control {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 50vh;
            left: 50vw;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            width: 400px;
            height: 200px;
            padding: 32px;
        }

        label {
            color: white;
            font-size: 18px;
            padding: 6px;
        }

        button {
            margin-top: 24px;
            margin-bottom: 18px;
            border: 2px solid white;
            font-size: 24px;
            cursor: pointer;
            background-color: transparent;
            border-radius: 5px;
            color: white;
            font-family: monospace;
            font-weight: bold;
            padding: 12px;
        }

        #launch-code-input {
            background: transparent;
            outline: none;
            border: none;
            border-bottom: 1px solid white;
            margin-bottom: 12px;
            color: white;
            letter-spacing: 2px;
            font-size: 18px;
            padding-top: 12px;
            text-align: center;
            align-self: center;
        }

        #launch-code-error {
            color: white;
            visibility: hidden;
            animation: flash 2.0s linear infinite;
        }

        #countdown {
            color: white;
            font-size: 64px;
            display: none;
        }

        #rocket {
            position: absolute;
            top: 70vh;
            left: 20vw;
            width: 100px;
            display: none;
        }

        #fire {
            position: absolute;
            top: 76vh;
            left: 20vw;
            width: 100px;
            display: none;
        }


        @keyframes takeoff {
            from {
                top: 70vh;
            }

            to {
                top: -20vh;
            }
        }

        @keyframes takeoffFire {
            from {
                top: 74vh;
            }

            to {
                top: -16vh;
            }
        }

        @keyframes flash {
            0% {
                opacity: 0;
            }

            50% {
                opacity: 0.7;
            }

            100% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <pre id="error"></pre>

    <div id="blackout">
        <button id="start" onclick="start(this);">Start</button>
    </div>

    <form id="mission-control" autocomplete="off">
        <p id="countdown" data-countdown-time=3></p>
        <p id="launch-code-error">Incorrect Launch Code!</p>
        <label id="launch-code-input-label" for="launch-code-input" autocomplete="off">Enter Launch Code</label>
        <input id="launch-code-input" type="text" />
        <button id="launch-button">Launch Rocket</button>
    </form>

    <img id="rocket" src="rocket.png" />
    <img id="fire" src="fire.png" />

    <audio id="ignition" src="ignition.mp3"></audio>

    <script>
        const missionControl = document.querySelector("#mission-control");
        const launchCodeInput = document.querySelector("#launch-code-input");
        const launchCodeError = document.querySelector("#launch-code-error");
        const launchButton = document.querySelector("#launch-button");
        const launchCodeInputLabel = document.querySelector("#launch-code-input-label");
        const countdown = document.querySelector("#countdown");
        const fire = document.querySelector("#fire");
        const rocket = document.querySelector("#rocket");
        const ignition = document.querySelector("#ignition");

        let countdownTime;
        let tickInterval;

        function launchRocket() {
            ignition.play();
            fire.style.display = "block";
            rocket.style.animation = "3s cubic-bezier(0.5, 0, 1, 1) forwards takeoff";
            fire.style.animation = "3s cubic-bezier(0.5, 0, 1, 1) forwards takeoffFire";
        }

        function tick() {
            if (!countdownTime) {
                launchRocket();
                clearInterval(tickInterval);
                return;
            };
            countdownTime--;
            countdown.textContent = countdownTime;
        }

        missionControl.addEventListener("submit", e => {
            e.preventDefault();

            const enteredLaunchCode = launchCodeInput.value;
            const correctLaunchCode = launchCodeInput.dataset.launchCode;

            if (enteredLaunchCode === correctLaunchCode) {
                launchCodeError.style.visibility = "hidden";
                launchCodeInput.style.display = "none";
                launchButton.style.display = "none";
                launchCodeInputLabel.style.display = "none";
                countdown.style.display = "block";
                countdownTime = countdown.dataset.countdownTime;
                countdown.textContent = countdownTime;
                tickInterval = setInterval(tick, 1000);
            } else {
                launchCodeError.style.visibility = "visible";
            }
        });

    </script>
    <script src="//projects.codewizardshq.com/assets/m11-start-script.js"></script>

</body>

</html>
